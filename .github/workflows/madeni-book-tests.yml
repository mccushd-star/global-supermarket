name: Madeni Book tests

on:
  push:
    paths: ['madeni-book/**', '.github/workflows/madeni-book-tests.yml']
  pull_request:
    paths: ['madeni-book/**', '.github/workflows/madeni-book-tests.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: madeni-book
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
